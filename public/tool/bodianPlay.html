<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>星之阁音乐播放器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        /* 防止tailwind覆盖自定义样式冲突 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            transition: background 0.3s ease;
        }
        
        .glass-effect {
            backdrop-filter: blur(20px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .rotate-album {
            animation: rotate 20s linear infinite;
        }
        
        .rotate-album.paused {
            animation-play-state: paused;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .lyrics-container {
            height: 160px;
            overflow-y: auto;
            overflow-x: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            background: rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            scrollbar-width: thin;
        }
        
        .lyric-item {
            padding: 10px 0;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.6;
        }
        
        .lyric-item.active {
            color: #FFD700;
            font-size: 24px;
            font-weight: 700;
            transform: scale(1.08);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            padding: 12px 0;
            opacity: 1;
        }
        
        .playlist-panel {
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        
        .playlist-panel.active {
            transform: translateX(0);
        }
        
        .volume-slider {
            -webkit-appearance: none;
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #FFD700;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .control-btn {
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .control-btn:hover {
            color: #FFD700;
            transform: scale(1.1);
        }
        
        .control-btn.active {
            color: #FFD700;
        }
        
        .play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .play-btn:hover {
            transform: scale(1.05);
        }
        
        .song-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .song-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-4px);
        }
        
        .song-card.current {
            background: rgba(255, 215, 0, 0.15);
            border-left: 3px solid #FFD700;
        }
        
        .rotating {
            animation: rotate 0.5s linear infinite;
        }
        
        /* 歌词模式专用 */
        /* 歌词模式样式 */
        body.lyrics-mode,
        html.lyrics-mode {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        html.lyrics-mode {
            height: 100%;
        }
        
        body.lyrics-mode {
            height: 100vh;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
        }
        
        body.lyrics-mode::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: var(--album-bg, linear-gradient(135deg, #667eea 0%, #764ba2 100%));
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.3);
            z-index: -1;
        }
        
        body.lyrics-mode .max-w-4xl {
            max-width: 100%;
            padding: 0;
            margin: 0;
        }
        
        body.lyrics-mode #player-card {
            width: 100%;
            height: 100vh;
            padding: 0;
            border-radius: 0;
            background: transparent;
            border: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
        }
        
        body.lyrics-mode .flex.justify-between.items-center.mb-6 {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        
        body.lyrics-mode .flex.justify-center.mb-6 {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            z-index: 50;
        }
        
        body.lyrics-mode .relative {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        body.lyrics-mode #album-container {
            width: 80vh;
            height: 80vh;
            border-radius: 50%;
            position: absolute;
            top: -40vh;
            left: -40vh;
            overflow: hidden;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 50;
        }
        
        body.lyrics-mode .text-center.mb-4 {
            position: fixed;
            top: 20px;
            left: 220px;
            right: 100px;
            text-align: left;
            z-index: 60;
        }
        
        body.lyrics-mode .text-center.mb-4 h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        
        body.lyrics-mode .text-center.mb-4 p {
            font-size: 0.9rem;
            margin: 0.25rem 0;
        }
        
        body.lyrics-mode .lyrics-container {
            flex: 1;
            height: calc(100vh - 200px);
            max-height: none;
            overflow-y: auto;
            overflow-x: hidden;
            background: transparent;
            border-radius: 0;
            mask-image: none;
            -webkit-mask-image: none;
            padding: 220px 40px 120px 40px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
            position: relative;
        }
        
        body.lyrics-mode .lyrics-container::-webkit-scrollbar {
            width: 8px;
        }
        
        body.lyrics-mode .lyrics-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        body.lyrics-mode .lyrics-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        
        body.lyrics-mode .lyrics-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        body.lyrics-mode #lyrics-wrapper {
            transform: none !important;
            transition: none !important;
        }
        
        body.lyrics-mode #lyrics {
            width: 100%;
            padding: 0;
        }
        
        body.lyrics-mode .lyric-item {
            font-size: 18px;
            padding: 15px 0;
            opacity: 0.5;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
        }
        
        body.lyrics-mode .lyric-item.active {
            font-size: 28px;
            opacity: 1;
            transform: scale(1.05);
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        body.lyrics-mode .mb-4:last-of-type {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            margin: 0;
        }
        
        body.lyrics-mode .progress-bar {
            margin: 0 0 10px 0;
        }
        
        body.lyrics-mode .flex.items-center.justify-center.gap-4 {
            justify-content: space-around;
            margin: 0;
        }
        
        body.lyrics-mode .flex.items-center.justify-center.gap-3 {
            display: none;
        }
        
        body.lyrics-mode .text-center.mt-2 {
            display: none;
        }
        
        .toast-message {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #FFD700;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 10000;
            white-space: nowrap;
            pointer-events: none;
            animation: fadeUp 1.2s ease forwards;
        }
        
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        
        @media (max-width: 768px) {
            body.lyrics-mode .lyric-item {
                font-size: 16px;
            }
            body.lyrics-mode .lyric-item.active {
                font-size: 24px;
            }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div id="player-card" class="glass-effect rounded-3xl p-6 md:p-8 mb-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-white text-xl font-bold">✨ 星之阁 · 乐宴</h1>
                <button id="playlist-btn" class="control-btn p-2">
                    <i class="fa fa-list text-xl"></i>
                </button>
            </div>
            
            <div class="flex justify-center mb-6">
                <div class="relative">
                    <div id="album-container" class="w-48 h-48 md:w-64 md:h-64 rounded-full overflow-hidden border-4 border-white/20 shadow-2xl rotate-album paused">
                        <img id="album-cover" src="https://picsum.photos/400/400?random=1" alt="封面" class="w-full h-full object-cover">
                    </div>
                    <div class="absolute inset-0 m-auto w-12 h-12 rounded-full bg-black/50 flex items-center justify-center border-2 border-white/20">
                        <div class="w-4 h-4 rounded-full bg-white/30"></div>
                    </div>
                </div>
            </div>
            
            <div class="text-center mb-4">
                <h2 id="song-title" class="text-white text-xl md:text-2xl font-bold mb-1">加载中...</h2>
                <p id="song-artist" class="text-white/70 text-base md:text-lg">等待播放</p>
                <p id="song-album" class="text-white/50 text-sm mt-1"></p>
            </div>
            
            <div class="lyrics-container mb-4" id="lyrics-scroll-container">
                <div id="lyrics">
                    <p class="lyric-item">✨ 点击此处进入歌词沉浸模式 ✨</p>
                    <p class="lyric-item">♪ 选择歌曲，享受音乐 ♪</p>
                </div>
            </div>
            
            <div class="mb-4">
                <div class="flex justify-between text-white/70 text-sm mb-2">
                    <span id="current-time">00:00</span>
                    <span id="total-time">00:00</span>
                </div>
                <div class="progress-bar" id="progress-container">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
            
            <div class="flex items-center justify-center gap-4 md:gap-6">
                <button id="shuffle-btn" class="control-btn p-2" title="播放模式">
                    <i class="fa fa-random text-lg"></i>
                </button>
                <button id="prev-btn" class="control-btn p-2">
                    <i class="fa fa-step-backward text-xl"></i>
                </button>
                <button id="play-btn" class="play-btn">
                    <i id="play-icon" class="fa fa-play text-white text-xl ml-1"></i>
                </button>
                <button id="next-btn" class="control-btn p-2">
                    <i class="fa fa-step-forward text-xl"></i>
                </button>
                <button id="repeat-btn" class="control-btn p-2">
                    <i class="fa fa-repeat text-lg"></i>
                </button>
            </div>
            
            <div class="text-center mt-2">
                <span id="play-mode-indicator" class="text-white/50 text-xs">列表循环</span>
            </div>
            
            <div class="flex items-center justify-center gap-3 mt-4">
                <button id="volume-btn" class="control-btn">
                    <i class="fa fa-volume-up text-lg"></i>
                </button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.75">
            </div>
        </div>
        
        <div class="glass-effect rounded-xl p-4 text-center">
            <p class="text-white/70 text-sm">
                <i class="fa fa-info-circle mr-2"></i>
                点击右侧歌单图标打开收藏 · 点击歌词区域进入全屏模式
            </p>
        </div>
    </div>
    
    <div id="playlist-panel" class="playlist-panel fixed top-0 right-0 h-full w-full md:w-96 bg-gray-900/95 backdrop-blur-lg z-50 shadow-2xl">
        <div class="p-4 flex justify-between items-center border-b border-white/10">
            <h3 class="text-white text-lg font-bold"><i class="fa fa-heart text-gold mr-2"></i>我的收藏</h3>
            <div class="flex items-center gap-2">
                <button id="refresh-playlist-btn" class="control-btn p-2"><i class="fa fa-refresh text-lg"></i></button>
                <button id="close-playlist-btn" class="control-btn p-2"><i class="fa fa-times text-xl"></i></button>
            </div>
        </div>
        <ul id="favorite-list" class="p-4 overflow-y-auto h-[calc(100%-60px)]"></ul>
    </div>
    
    <audio id="audio-player" preload="auto" crossorigin="anonymous"></audio>
    
    <script>
        // ---------- 全局状态 ----------
        let playlist = [];            // 歌曲对象数组
        let currentSongIndex = -1;
        let playMode = 'list';       // list, shuffle, single
        let isLyricsMode = false;
        let isDragging = false;
        let isUserScrolling = false; // 用户是否正在滚动歌词
        let userScrollTimer = null;  // 用户滚动计时器
        let currentProgressPercent = 0;
        
        // DOM 元素
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressFill = document.getElementById('progress-fill');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeSpan = document.getElementById('current-time');
        const totalTimeSpan = document.getElementById('total-time');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeBtn = document.getElementById('volume-btn');
        const songTitleEl = document.getElementById('song-title');
        const songArtistEl = document.getElementById('song-artist');
        const songAlbumEl = document.getElementById('song-album');
        const albumCover = document.getElementById('album-cover');
        const albumContainerDiv = document.getElementById('album-container');
        const lyricsDiv = document.getElementById('lyrics');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const playlistBtn = document.getElementById('playlist-btn');
        const playlistPanel = document.getElementById('playlist-panel');
        const closePlaylistBtn = document.getElementById('close-playlist-btn');
        const modeIndicator = document.getElementById('play-mode-indicator');
        const lyricsContainer = document.getElementById('lyrics-scroll-container');
        
        // 歌词滚动事件 - 检测用户滚动
        lyricsContainer.addEventListener('scroll', () => {
            isUserScrolling = true;
            if (userScrollTimer) clearTimeout(userScrollTimer);
            userScrollTimer = setTimeout(() => {
                isUserScrolling = false;
            }, 15000); // 15秒后恢复自动滚动
        });
        
        // 辅助函数
        function formatTime(sec) {
            if (isNaN(sec)) return "00:00";
            const mins = Math.floor(sec / 60);
            const seconds = Math.floor(sec % 60);
            return `${mins.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
        }
        
        function showToast(msg, duration = 1500) {
            const exist = document.querySelector('.toast-message');
            if(exist) exist.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }
        
        // 获取音频真实URL (代理)
        async function fetchAudioUrl(apiUrl) {
            try {
                const resp = await fetch(apiUrl);
                if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const json = await resp.json();
                if(json && json.data && json.data.src) {
                    return "https://hzliflow.ken520.top/api/cors?url=" + encodeURIComponent(json.data.src);
                }
                throw new Error("无效音频链接");
            } catch(e) {
                throw e;
            }
        }
        
        // 获取歌词
        async function fetchLyrics(title, artist, album) {
            const directUrl = `https://api.lrc.cx/lyrics?title=${encodeURIComponent(title)}&artist=${encodeURIComponent(artist)}${album ? `&album=${encodeURIComponent(album)}` : ''}`;
            const proxyUrl = `https://hzliflow.ken520.top/api/cors?url=${encodeURIComponent(directUrl)}`;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 100000);
            try {
                const res = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeout);
                if (res.ok) {
                    const text = await res.text();
                    return text || "[00:00.00]纯音乐，请静静欣赏";
                }
                return "[00:00.00]✨ 暂无歌词，享受旋律吧 ✨\n[05:00.00]音乐与你相伴";
            } catch(e) {
                clearTimeout(timeout);
                return "[00:00.00]✨ 暂无歌词，享受旋律吧 ✨\n[05:00.00]音乐与你相伴";
            }
        }
        
        // 解析LRC并渲染
        function renderLyrics(lrcText) {
            if(!lyricsDiv) return;
            lyricsDiv.innerHTML = '';
            if(!lrcText || lrcText.trim() === '') {
                const empty = document.createElement('p');
                empty.className = 'lyric-item';
                empty.innerText = '♪ 没有歌词，静静聆听 ♪';
                lyricsDiv.appendChild(empty);
                return;
            }
            const lines = lrcText.split(/\r?\n/);
            const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            let hasMatch = false;
            lines.forEach(line => {
                const match = line.match(regex);
                if(match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const msRaw = match[3];
                    const ms = parseInt(msRaw.padEnd(3,'0').slice(0,3));
                    const time = minutes * 60 + seconds + ms / 1000;
                    const text = match[4].trim();
                    if(text) {
                        const p = document.createElement('p');
                        p.className = 'lyric-item';
                        p.innerText = text;
                        p.setAttribute('data-time', time);
                        lyricsDiv.appendChild(p);
                        hasMatch = true;
                    }
                }
            });
            if(!hasMatch) {
                const fallback = document.createElement('p');
                fallback.className = 'lyric-item';
                fallback.innerText = '✨ 纯音乐 / 未匹配歌词 ✨';
                lyricsDiv.appendChild(fallback);
            }
        }
        
        // 高亮歌词 & 滚动 (同时支持两种模式)
        function updateLyricsHighlight() {
            if(!audio || isNaN(audio.currentTime)) return;
            const curTime = audio.currentTime;
            const items = document.querySelectorAll('.lyric-item');
            if(!items.length) return;
            let activeIdx = -1;
            for(let i=0; i<items.length; i++) {
                const t = parseFloat(items[i].getAttribute('data-time'));
                if(!isNaN(t) && t <= curTime) activeIdx = i;
            }
            items.forEach((item, idx) => {
                if(idx === activeIdx) item.classList.add('active');
                else item.classList.remove('active');
            });
            // 滚动到激活行
            if(activeIdx !== -1) {
                const activeEl = items[activeIdx];
                const container = lyricsContainer;
                if(container) {
                    const offsetTop = activeEl.offsetTop;
                    const containerHeight = container.clientHeight;
                    const targetScroll = offsetTop - containerHeight/2 + activeEl.clientHeight/2;
                    if(isLyricsMode) {
                        container.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
                    } else {
                        container.scrollTop = Math.max(0, targetScroll);
                    }
                }
            }
        }
        
        // 切换歌曲
        async function switchToSong(song, index, autoPlay = false) {
            const wasPlaying = !audio.paused;
            audio.pause();
            currentSongIndex = index;
            songTitleEl.innerText = song.title || "未知曲目";
            songArtistEl.innerText = song.artist || "未知艺人";
            songAlbumEl.innerText = song.album || "";
            albumCover.src = song.albumCover || "https://picsum.photos/400/400?random=1";
            audio.src = song.audioUrl;
            
            // 更新歌词模式背景
            updateLyricsModeBackground(song.albumCover || "https://picsum.photos/400/400?random=1");
            
            // 加载歌词
            const lrc = await fetchLyrics(song.title, song.artist, song.album);
            renderLyrics(lrc);
            
            // 等待元数据加载
            await new Promise(resolve => {
                const onLoad = () => { audio.removeEventListener('loadedmetadata', onLoad); resolve(); };
                audio.addEventListener('loadedmetadata', onLoad);
                if(audio.readyState >= 1) resolve();
                setTimeout(resolve, 800);
            });
            
            if(wasPlaying || autoPlay) {
                await audio.play().catch(e => showToast("⚠️ 自动播放被阻止，请手动点击播放"));
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                albumContainerDiv.classList.remove('paused');
            } else {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                albumContainerDiv.classList.add('paused');
            }
            updatePlaylistHighlight();
            playlistPanel.classList.remove('active');
            updateProgressDisplay();
        }
        
        // 播放&暂停控制
        function togglePlay() {
            if(playlist.length === 0) {
                showToast("💿 暂无歌曲，请先刷新收藏列表");
                return;
            }
            if(audio.paused) {
                audio.play().then(() => {
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    albumContainerDiv.classList.remove('paused');
                }).catch(e => showToast("无法播放: " + e.message));
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                albumContainerDiv.classList.add('paused');
            }
        }
        
        // 下一首逻辑
        async function playNext() {
            if(playlist.length === 0) return;
            let nextIdx = currentSongIndex;
            if(playMode === 'shuffle') {
                nextIdx = Math.floor(Math.random() * playlist.length);
            } else {
                nextIdx = (currentSongIndex + 1) % playlist.length;
            }
            await switchToSong(playlist[nextIdx], nextIdx, true);
        }
        
        async function playPrev() {
            if(playlist.length === 0) return;
            let prevIdx = currentSongIndex;
            if(playMode === 'shuffle') {
                prevIdx = Math.floor(Math.random() * playlist.length);
            } else {
                prevIdx = (currentSongIndex - 1 + playlist.length) % playlist.length;
            }
            await switchToSong(playlist[prevIdx], prevIdx, true);
        }
        
        // 进度跳转
        function seekTo(percent) {
            if(audio.duration && isFinite(audio.duration)) {
                audio.currentTime = percent * audio.duration;
            }
        }
        
        function updateProgressDisplay() {
            if(isDragging) return;
            if(audio.duration && !isNaN(audio.duration)) {
                const percent = audio.currentTime / audio.duration;
                progressFill.style.width = `${percent * 100}%`;
                currentTimeSpan.innerText = formatTime(audio.currentTime);
                totalTimeSpan.innerText = formatTime(audio.duration);
            } else {
                progressFill.style.width = '0%';
            }
            updateLyricsHighlight();
        }
        
        // 播放模式切换
        function cyclePlayMode() {
            const modes = ['list', 'shuffle', 'single'];
            const idx = modes.indexOf(playMode);
            playMode = modes[(idx+1) % 3];
            audio.loop = (playMode === 'single');
            updateModeUI();
            let modeName = { list:'📋 列表循环', shuffle:'🔀 随机播放', single:'🔁 单曲循环' }[playMode];
            showToast(modeName);
        }
        
        function updateModeUI() {
            shuffleBtn.classList.remove('active');
            repeatBtn.classList.remove('active');
            if(playMode === 'shuffle') shuffleBtn.classList.add('active');
            if(playMode === 'single') repeatBtn.classList.add('active');
            const txt = { list:'列表循环', shuffle:'随机播放', single:'单曲循环' }[playMode];
            modeIndicator.innerText = txt;
        }
        
        // 更新音量图标
        function updateVolumeIcon() {
            if(audio.muted || audio.volume === 0) volumeBtn.innerHTML = '<i class="fa fa-volume-off text-lg"></i>';
            else if(audio.volume < 0.5) volumeBtn.innerHTML = '<i class="fa fa-volume-down text-lg"></i>';
            else volumeBtn.innerHTML = '<i class="fa fa-volume-up text-lg"></i>';
        }
        
        // 渲染收藏列表 (从localStorage)
        async function renderFavList() {
            const favListUl = document.getElementById('favorite-list');
            favListUl.innerHTML = '<div class="text-white/50 text-center py-8">加载中...</div>';
            try {
                const raw = localStorage.getItem('Apollo_XZG_BoDian_Love');
                if(!raw) throw new Error('no data');
                const items = JSON.parse(raw);
                if(!Array.isArray(items) || items.length === 0) throw new Error('empty');
                playlist = [];
                favListUl.innerHTML = '';
                for(let i=0; i<items.length; i++) {
                    const item = items[i];
                    if(!item || item.length < 4) continue;
                    try {
                        const audioRealUrl = await fetchAudioUrl(item[0]);
                        const songObj = {
                            title: item[1] || '未知歌曲',
                            artist: item[2] || '未知歌手',
                            album: item[4] || '',
                            albumCover: item[3] || 'https://picsum.photos/400/400?random=1',
                            audioUrl: audioRealUrl
                        };
                        playlist.push(songObj);
                        const li = document.createElement('li');
                        li.className = 'song-card flex items-center gap-3 p-3 rounded-lg mb-2 cursor-pointer';
                        li.setAttribute('data-index', playlist.length-1);
                        li.innerHTML = `
                            <img src="${songObj.albumCover}" class="w-14 h-14 object-cover rounded-lg">
                            <div class="flex-1 min-w-0">
                                <div class="text-white font-medium truncate">${escapeHtml(songObj.title)}</div>
                                <div class="text-white/50 text-sm truncate">${escapeHtml(songObj.artist)}</div>
                            </div>
                            <button class="play-fav-btn control-btn p-2"><i class="fa fa-play"></i></button>
                        `;
                        const playBtnFav = li.querySelector('.play-fav-btn');
                        playBtnFav.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const idx = parseInt(li.getAttribute('data-index'));
                            switchToSong(playlist[idx], idx, true);
                        });
                        li.addEventListener('click', () => {
                            const idx = parseInt(li.getAttribute('data-index'));
                            switchToSong(playlist[idx], idx, true);
                        });
                        favListUl.appendChild(li);
                    } catch(err) { console.warn(err); }
                }
                if(playlist.length === 0) throw new Error('empty final');
                if(currentSongIndex === -1 && playlist.length > 0) {
                    await switchToSong(playlist[0], 0, false);
                }
                updatePlaylistHighlight();
            } catch(e) {
                favListUl.innerHTML = '<div class="text-center text-white/50 py-8">💔 暂无收藏歌曲，请先收藏音乐</div>';
                playlist = [];
            }
        }
        
        function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
        
        function updatePlaylistHighlight() {
            document.querySelectorAll('.song-card').forEach((card, idx) => {
                if(idx === currentSongIndex) card.classList.add('current');
                else card.classList.remove('current');
            });
        }
        
        // 更新歌词模式背景
        function updateLyricsModeBackground(albumCoverUrl) {
            const playerCard = document.getElementById('player-card');
            if (playerCard) {
                playerCard.style.setProperty('--album-bg', `url('${albumCoverUrl}')`);
            }
        }
        
        // 歌词模式切换
        function toggleLyricsMode() {
            if(window.innerWidth <= 768) {
                showToast("📱 移动端暂不支持全屏歌词模式，请使用PC体验");
                return;
            }
            isLyricsMode = !isLyricsMode;
            const html = document.documentElement;
            const body = document.body;
            
            if(isLyricsMode) {
                html.classList.add('lyrics-mode');
                body.classList.add('lyrics-mode');
                body.style.overflow = 'hidden';
                
                // 更新背景
                updateLyricsModeBackground(currentSong.albumCover);
                
                showToast("🎤 进入沉浸歌词模式 (ESC退出)");
                setTimeout(() => updateLyricsHighlight(), 100);
            } else {
                html.classList.remove('lyrics-mode');
                body.classList.remove('lyrics-mode');
                body.style.overflow = 'auto';
                
                // 重置歌词位置
                if(lyricsWrapper) {
                    lyricsWrapper.style.transform = 'translateY(0)';
                }
                
                showToast("🎧 退出歌词模式");
            }
        }
        
        // 事件绑定
        function bindEvents() {
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', () => playPrev().catch(e=>showToast("切换失败")));
            nextBtn.addEventListener('click', () => playNext().catch(e=>showToast("切换失败")));
            volumeSlider.addEventListener('input', (e) => {
                audio.volume = parseFloat(e.target.value);
                audio.muted = false;
                updateVolumeIcon();
            });
            volumeBtn.addEventListener('click', () => {
                audio.muted = !audio.muted;
                if(!audio.muted) volumeSlider.value = audio.volume;
                else volumeSlider.value = 0;
                updateVolumeIcon();
            });
            shuffleBtn.addEventListener('click', cyclePlayMode);
            repeatBtn.addEventListener('click', cyclePlayMode);
            playlistBtn.addEventListener('click', () => playlistPanel.classList.toggle('active'));
            closePlaylistBtn.addEventListener('click', () => playlistPanel.classList.remove('active'));
            document.getElementById('refresh-playlist-btn')?.addEventListener('click', async () => {
                const icon = document.querySelector('#refresh-playlist-btn i');
                icon?.classList.add('rotating');
                await renderFavList();
                setTimeout(() => icon?.classList.remove('rotating'), 500);
                showToast("🔄 歌单已刷新");
            });
            // 进度条拖拽
            progressContainer.addEventListener('mousedown', startDrag);
            progressContainer.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', onDrag);
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchmove', onDrag, {passive: false});
            window.addEventListener('touchend', endDrag);
            
            audio.addEventListener('timeupdate', () => { if(!isDragging) updateProgressDisplay(); if(!isUserScrolling) updateLyricsHighlight(); });
            audio.addEventListener('loadedmetadata', updateProgressDisplay);
            audio.addEventListener('ended', () => {
                if(playMode === 'single') {
                    audio.currentTime = 0;
                    audio.play().catch(e=>null);
                } else {
                    playNext().catch(e=>null);
                }
            });
            audio.addEventListener('play', () => {
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                albumContainerDiv.classList.remove('paused');
            });
            audio.addEventListener('pause', () => {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                albumContainerDiv.classList.add('paused');
            });
            // 歌词点击切换模式
            lyricsContainer.addEventListener('click', (e) => {
                if(!isLyricsMode && window.innerWidth > 768) toggleLyricsMode();
                else if(isLyricsMode && window.innerWidth > 768) toggleLyricsMode();
            });
            document.addEventListener('keydown', (e) => {
                if(e.code === 'Escape' && isLyricsMode) toggleLyricsMode();
                if(e.code === 'Space' && document.activeElement?.tagName !== 'INPUT') {
                    e.preventDefault();
                    togglePlay();
                }
                if(e.code === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); showToast("◀ 后退5秒"); e.preventDefault();}
                if(e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); showToast("▶ 前进5秒"); e.preventDefault();}
                if(e.code === 'KeyM') { cyclePlayMode(); e.preventDefault();}
            });
        }
        
        // 拖拽逻辑
        function getPercentFromEvent(e) {
            const rect = progressContainer.getBoundingClientRect();
            let clientX = e.clientX;
            if(e.touches) clientX = e.touches[0].clientX;
            let percent = (clientX - rect.left) / rect.width;
            return Math.min(1, Math.max(0, percent));
        }
        function startDrag(e) {
            e.preventDefault();
            isDragging = true;
            const percent = getPercentFromEvent(e);
            progressFill.style.width = `${percent*100}%`;
            seekTo(percent);
        }
        function onDrag(e) {
            if(!isDragging) return;
            e.preventDefault();
            const percent = getPercentFromEvent(e);
            progressFill.style.width = `${percent*100}%`;
            seekTo(percent);
        }
        function endDrag(e) {
            if(isDragging) {
                const percent = getPercentFromEvent(e);
                seekTo(percent);
                isDragging = false;
                updateProgressDisplay();
            }
        }
        
        // 初始化
        window.addEventListener('DOMContentLoaded', async () => {
            audio.volume = 0.75;
            updateVolumeIcon();
            updateModeUI();
            await renderFavList();
            bindEvents();
        });
    </script>
</body>
</html>
