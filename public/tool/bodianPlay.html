<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器 - 星之阁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" type="image/png"
        href="https://static.bcmcdn.com/coco/player/unstable/r158rJpByx.image/jpeg?hash=FtXSHESVlIdg5bOCixyXyh3J65So">

    <meta name="apple-mobile-web-app-title" content="CodePen">

    <link rel="shortcut icon" type="image/x-icon"
        href="https://static.bcmcdn.com/coco/player/unstable/r158rJpByx.image/jpeg?hash=FtXSHESVlIdg5bOCixyXyh3J65So">

    <link rel="mask-icon" type="image/x-icon"
        href="https://static.bcmcdn.com/coco/player/unstable/r158rJpByx.image/jpeg?hash=FtXSHESVlIdg5bOCixyXyh3J65So"
        color="#111">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFD700',
                        secondary: '#FFA500',
                        gold: {
                            light: '#FFF3CD',
                            DEFAULT: '#FFD700',
                            dark: '#FFA500',
                            darker: '#D4AF37'
                        },
                        dark: '#121212',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        .glass-effect {
            backdrop-filter: blur(20px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .rotate-album {
            animation: rotate 20s linear infinite;
        }
        
        .rotate-album.paused {
            animation-play-state: paused;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 3px;
            transition: width 0.1s linear;
        }
        
        .progress-fill.dragging {
            transition: none;
        }
        
        .lyrics-container {
            height: 160px;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            background: rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        
        #lyrics {
            padding: 20px 0;
            min-height: 100%;
        }
        
        #lyrics-wrapper {
            transition: transform 0.3s ease-out;
        }
        
        .lyric-item {
            padding: 10px 0;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.5;
            display: block;
        }
        
        .lyric-item:first-child {
            margin-top: 0;
        }
        
        .lyric-item.active {
            color: #FFD700;
            font-size: 24px;
            font-weight: 700;
            transform: scale(1.15);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.4), 0 0 60px rgba(255, 215, 0, 0.2);
            padding: 12px 0;
            opacity: 1;
        }
        
        .playlist-panel {
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        
        .playlist-panel.active {
            transform: translateX(0);
        }
        
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #FFD700;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        
        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #FFD700;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        
        .control-btn {
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }
        
        .control-btn:hover {
            color: #FFD700;
            transform: scale(1.1);
        }
        
        .control-btn.active {
            color: #FFD700;
        }
        
        #play-mode-indicator {
            transition: all 0.3s ease;
        }
        
        .play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
        }
        
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }
        
        .song-card {
            transition: all 0.3s ease;
        }
        
        .song-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-4px);
        }
        
        .song-card.current {
            background: rgba(255, 215, 0, 0.15);
            border-left: 3px solid #FFD700;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- 主播放器卡片 -->
        <div class="glass-effect rounded-3xl p-6 md:p-8 mb-6">
            <!-- 顶部信息 -->
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-white text-xl font-bold">音乐播放器</h1>
                <button id="playlist-btn" class="control-btn p-2">
                    <i class="fa fa-list text-xl"></i>
                </button>
            </div>
            
            <!-- 专辑封面 -->
            <div class="flex justify-center mb-6">
                <div class="relative">
                    <div id="album-container" class="w-48 h-48 md:w-64 md:h-64 rounded-full overflow-hidden border-4 border-white/20 shadow-2xl rotate-album paused">
                        <img id="album-cover" src="https://picsum.photos/400/400?random=1" alt="专辑封面" class="w-full h-full object-cover">
                    </div>
                    <div class="absolute inset-0 m-auto w-12 h-12 rounded-full bg-black/50 flex items-center justify-center border-2 border-white/20">
                        <div class="w-4 h-4 rounded-full bg-white/30"></div>
                    </div>
                </div>
            </div>
            
            <!-- 歌曲信息 -->
            <div class="text-center mb-4">
                <h2 id="song-title" class="text-white text-xl md:text-2xl font-bold mb-1">歌曲名称</h2>
                <p id="song-artist" class="text-white/70 text-base md:text-lg">艺术家</p>
                <p id="song-album" class="text-white/50 text-sm mt-1">专辑</p>
            </div>
            
            <!-- 歌词 -->
            <div class="lyrics-container mb-4">
                <div id="lyrics-wrapper" class="transition-transform duration-300">
                    <div id="lyrics">
                        <p class="lyric-item">本歌曲没有歌词，请欣赏音乐...</p>
                    </div>
                </div>
            </div>
            
            <!-- 进度条 -->
            <div class="mb-4">
                <div class="flex justify-between text-white/70 text-sm mb-2">
                    <span id="current-time">00:00</span>
                    <span id="total-time">00:00</span>
                </div>
                <div class="progress-bar" id="progress-container">
                    <div id="progress-bar" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- 控制按钮 -->
            <div class="flex items-center justify-center gap-4 md:gap-6">
                <button id="shuffle-btn" class="control-btn p-2" title="切换播放模式 (M)">
                    <i class="fa fa-random text-lg"></i>
                </button>
                <button id="prev-btn" class="control-btn p-2" title="上一首">
                    <i class="fa fa-step-backward text-xl"></i>
                </button>
                <button id="play-btn" class="play-btn" title="播放/暂停 (空格)">
                    <i id="play-icon" class="fa fa-play text-white text-xl ml-1"></i>
                </button>
                <button id="next-btn" class="control-btn p-2" title="下一首">
                    <i class="fa fa-step-forward text-xl"></i>
                </button>
                <button id="repeat-btn" class="control-btn p-2" title="切换播放模式 (M)">
                    <i class="fa fa-repeat text-lg"></i>
                </button>
            </div>
            
            <!-- 播放模式指示器 -->
            <div class="text-center mt-2">
                <span id="play-mode-indicator" class="text-white/50 text-xs"></span>
            </div>
            
            <!-- 音量控制 -->
            <div class="flex items-center justify-center gap-3 mt-4">
                <button id="volume-btn" class="control-btn">
                    <i class="fa fa-volume-up text-lg"></i>
                </button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.75">
            </div>
        </div>
        
        <!-- 快捷提示 -->
        <div class="glass-effect rounded-xl p-4 text-center">
            <p class="text-white/70 text-sm">
                <i class="fa fa-info-circle mr-2"></i>
                点击右上角列表图标打开收藏歌单
            </p>
        </div>
    </div>
    
    <!-- 播放列表侧边栏 -->
    <div id="playlist-panel" class="playlist-panel fixed top-0 right-0 h-full w-full md:w-96 bg-gray-900/95 backdrop-blur-lg z-50 shadow-2xl">
        <div class="p-4 flex justify-between items-center border-b border-white/10">
            <h3 class="text-white text-lg font-bold">
                <i class="fa fa-heart text-gold mr-2"></i>
                收藏列表
            </h3>
            <button id="close-playlist-btn" class="control-btn p-2">
                <i class="fa fa-times text-xl"></i>
            </button>
        </div>
        <ul id="favorite-list" class="p-4 overflow-y-auto h-[calc(100%-60px)]">
            <!-- 收藏列表将通过JS动态加载 -->
        </ul>
    </div>
    
    <!-- 音频元素 -->
    <audio id="audio-player" preload="auto" crossorigin="anonymous"></audio>
    
    <script>
        // 全局变量
        let currentSongIndex = -1;
        let playlist = [];
        // 播放模式：'list' - 列表循环, 'shuffle' - 随机播放, 'single' - 单曲循环
        let playMode = 'list';
        
        // DOM元素
        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const volumeBtn = document.getElementById('volume-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const songTitleEl = document.getElementById('song-title');
        const songArtistEl = document.getElementById('song-artist');
        const songAlbumEl = document.getElementById('song-album');
        const albumCoverEl = document.getElementById('album-cover');
        const albumContainer = document.getElementById('album-container');
        const lyricsEl = document.getElementById('lyrics');
        const lyricsWrapper = document.getElementById('lyrics-wrapper');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const playlistBtn = document.getElementById('playlist-btn');
        const playlistPanel = document.getElementById('playlist-panel');
        const closePlaylistBtn = document.getElementById('close-playlist-btn');
        
        // 当前歌曲信息
        let currentSong = {
            title: "未命名歌曲",
            artist: "未知艺术家",
            album: "未知专辑",
            albumCover: "https://picsum.photos/400/400?random=1",
            audioUrl: "",
            lyrics: ""
        };
        
        // 获取歌词
        async function GetLyrics(song) {
            const G_title = song.title;
            const G_artist = song.artist;
            const G_album = song.album || "";
            
            console.log(`获取歌词 - 歌曲名: ${G_title}, 歌手: ${G_artist}, 专辑: ${G_album}`);
            
            try {
                const proxyUrl = 'https://hzliflow.ken520.top/api/cors?url=';
                const targetUrl = encodeURIComponent(`https://api.lrc.cx/lyrics?title=${G_title}&artist=${G_artist}${G_album ? `&album=${G_album}` : ''}`);
                
                console.log('请求歌词URL:', targetUrl);
                
                const response = await fetch(proxyUrl + targetUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'text/plain, */*'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态: ${response.status}`);
                }

                const lyricsText = await response.text();
                console.log('获取到的歌词文本长度:', lyricsText.length);
                console.log('歌词文本预览:', lyricsText.substring(0, 200));
                return lyricsText;
                
            } catch (error) {
                console.error('获取歌词文本失败:', error);
                console.log('使用默认歌词');
                return `[00:00.000]暂未找到歌曲歌词文件
[00:05.525]请尽情
[00:15.147]欣赏
[00:25.599]音乐吧`;
            }
        }
        
        // 获取音频URL
        async function GetNowAudioUrl(s_url) {
            try {
                const response = await fetch(s_url);
                
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态: ${response.status}`);
                }
                
                const jsonData = await response.json();
                const src = "https://hzliflow.ken520.top/api/cors?url=" + encodeURIComponent(jsonData.data.src);
                console.log('获取到的音频URL:', src);
                return src;
                
            } catch (error) {
                console.error('获取音频URL失败:', error);
                throw error;
            }
        }
        
        // 切换到指定歌曲
        async function switchToSong(song, index, autoPlay = false) {
            console.log('切换到歌曲:', song.title, '索引:', index, '自动播放:', autoPlay);
            
            // 停止当前播放
            const wasPlaying = !audioPlayer.paused;
            audioPlayer.pause();
            
            // 更新当前歌曲信息
            currentSong = song;
            currentSongIndex = index;
            
            // 更新UI
            songTitleEl.textContent = song.title;
            songArtistEl.textContent = song.artist;
            songAlbumEl.textContent = song.album || "未知专辑";
            albumCoverEl.src = song.albumCover;
            audioPlayer.src = song.audioUrl;
            
            // 等待音频加载完成
            try {
                await new Promise((resolve, reject) => {
                    audioPlayer.addEventListener('loadedmetadata', resolve, { once: true });
                    audioPlayer.addEventListener('error', reject, { once: true });
                    
                    // 设置超时，防止卡住
                    setTimeout(() => reject(new Error('音频加载超时')), 10000);
                });
                
                console.log('音频加载完成');
            } catch (error) {
                console.error('音频加载失败:', error);
                // 即使加载失败也继续执行，让用户看到歌曲信息
            }
            
            // 获取并解析歌词
            console.log("开始获取歌曲歌词...");
            const Songlyrics = await GetLyrics(song);
            console.log("歌词获取完成，开始解析...");
            parseLyrics(Songlyrics);
            console.log("歌词解析完成");
            
            // 如果之前在播放，或者要求自动播放，则播放新歌曲
            if (wasPlaying || autoPlay) {
                console.log('准备播放新歌曲');
                setTimeout(() => {
                    playAudio();
                }, 100);
            }
            
            // 更新播放列表高亮
            updatePlaylistHighlight();
            
            // 关闭播放列表
            playlistPanel.classList.remove('active');
            
            // 强制更新一次歌词显示
            setTimeout(() => {
                console.log("强制更新歌词显示");
                updateLyrics();
            }, 200);
        }
        
        // 解析LRC格式歌词
        function parseLyrics(lrcText) {
            console.log("解析歌词");
            console.log("歌词文本长度:", lrcText ? lrcText.length : 0);
            
            // 检查DOM元素是否存在
            if (!lyricsEl) {
                console.error("歌词容器元素不存在！");
                return;
            }
            
            // 重置歌词容器滚动位置
            if (lyricsWrapper) {
                lyricsWrapper.style.transform = 'translateY(0)';
                console.log("已重置歌词容器位置");
            }
            
            // 清空现有歌词
            lyricsEl.innerHTML = '';
            console.log("已清空歌词容器");
            
            if (!lrcText || lrcText.trim() === '') {
                console.log("歌词文本为空");
                const emptyLyric = document.createElement('p');
                emptyLyric.className = 'lyric-item';
                emptyLyric.textContent = '本歌曲没有歌词，请欣赏音乐...';
                lyricsEl.appendChild(emptyLyric);
                console.log("已添加空歌词提示");
                return;
            }
            
            const lines = lrcText.split('\n');
            console.log("歌词行数:", lines.length);
            const lyricPattern = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            let parsedCount = 0;
            
            lines.forEach(line => {
                const match = line.match(lyricPattern);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const milliseconds = parseInt(match[3]);
                    const timeInSeconds = minutes * 60 + seconds + milliseconds / Math.pow(10, match[3].length);
                    
                    const text = match[4].trim();
                    
                    if (text) {
                        const lyricEl = document.createElement('p');
                        lyricEl.className = 'lyric-item';
                        lyricEl.textContent = text;
                        lyricEl.dataset.time = timeInSeconds;
                        
                        lyricsEl.appendChild(lyricEl);
                        parsedCount++;
                    }
                }
            });
            
            console.log(`歌词解析完成，共解析 ${parsedCount} 行歌词`);
            console.log("歌词容器中的元素数量:", lyricsEl.children.length);
            
            // 验证歌词是否已添加到DOM
            setTimeout(() => {
                const actualCount = lyricsEl.querySelectorAll('.lyric-item').length;
                console.log("验证：DOM中的歌词元素数量:", actualCount);
                if (actualCount === 0) {
                    console.error("警告：歌词元素未正确添加到DOM！");
                }
            }, 100);
        }
        
        // 更新歌词显示
        function updateLyrics() {
            // 检查DOM元素是否存在
            if (!lyricsEl) {
                console.error("歌词容器元素不存在！");
                return;
            }
            
            const currentTime = audioPlayer.currentTime;
            const lyrics = lyricsEl.querySelectorAll('.lyric-item');
            
            if (lyrics.length === 0) {
                console.log("没有歌词可更新");
                return;
            }
            
            let activeIndex = -1;
            
            // 找到当前时间对应的歌词
            lyrics.forEach((lyric, index) => {
                const lyricTime = parseFloat(lyric.dataset.time);
                if (!isNaN(lyricTime) && lyricTime <= currentTime) {
                    activeIndex = index;
                }
            });
            
            // 更新歌词高亮状态
            lyrics.forEach((lyric, index) => {
                if (index === activeIndex) {
                    lyric.classList.add('active');
                } else {
                    lyric.classList.remove('active');
                }
            });
            
            // 滚动到当前歌词
            if (activeIndex !== -1 && lyricsWrapper) {
                const activeLyric = lyrics[activeIndex];
                
                // 获取容器信息
                const lyricsContainer = document.querySelector('.lyrics-container');
                const containerHeight = lyricsContainer ? lyricsContainer.clientHeight : 160;
                const lyricHeight = activeLyric.offsetHeight || 24;
                
                // 计算滚动位置（相对于 lyrics-container）
                const lyricsWrapperTop = lyricsWrapper.offsetTop || 0;
                const activeLyricTop = activeLyric.offsetTop || 0;
                const scrollPosition = lyricsWrapperTop + activeLyricTop - containerHeight / 2 + lyricHeight / 2;
                
                // 确保滚动位置不为负
                const finalScrollPosition = Math.max(0, scrollPosition);
                
                console.log(`歌词滚动 - 容器高度: ${containerHeight}px, 歌词高度: ${lyricHeight}px, 滚动位置: ${finalScrollPosition.toFixed(1)}px`);
                
                // 移除 transition 以提高滚动响应速度
                lyricsWrapper.style.transition = 'none';
                lyricsWrapper.style.transform = `translateY(-${finalScrollPosition}px)`;
                
                // 恢复 transition
                setTimeout(() => {
                    lyricsWrapper.style.transition = 'transform 0.3s ease-out';
                }, 50);
                
                // 调试信息
                if (Math.floor(currentTime) % 5 === 0) {
                    console.log(`当前时间: ${currentTime.toFixed(2)}s, 高亮歌词索引: ${activeIndex}, 内容: "${activeLyric.textContent.trim()}"`);
                }
            } else if (lyricsWrapper) {
                // 如果没有匹配的歌词，重置位置到开头
                console.log("重置歌词滚动位置");
                lyricsWrapper.style.transform = 'translateY(0)';
            }
        }
        
        // 更新进度条
        function updateProgress() {
            if (isNaN(audioPlayer.duration)) return;
            
            // 如果正在拖拽，不更新进度条
            if (isDragging) return;
            
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressBar.style.width = `${percent}%`;
            
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            totalTimeEl.textContent = formatTime(audioPlayer.duration || 0);
            
            updateLyrics();
        }
        
        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 播放音频
        function playAudio() {
            console.log('尝试播放音频:', audioPlayer.src);
            audioPlayer.play()
                .then(() => {
                    console.log('播放成功');
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    albumContainer.classList.remove('paused');
                })
                .catch(error => {
                    console.error('播放失败:', error);
                    // 如果播放失败，可能是浏览器阻止了自动播放，显示提示
                    if (error.name === 'NotAllowedError') {
                        console.log('浏览器阻止了自动播放，需要用户交互');
                    }
                });
        }
        
        // 暂停音频
        function pauseAudio() {
            audioPlayer.pause();
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
            albumContainer.classList.add('paused');
        }
        
        // 播放/暂停切换
        function togglePlay() {
            if (audioPlayer.paused) {
                if (playlist.length === 0) {
                    alert('请先从收藏列表选择歌曲');
                    return;
                }
                playAudio();
            } else {
                pauseAudio();
            }
        }
        
        // 播放上一首
        function playPrev(autoPlay = false) {
            if (playlist.length === 0) return;
            
            let prevIndex;
            if (playMode === 'shuffle') {
                // 随机播放模式下，随机选择上一首
                prevIndex = Math.floor(Math.random() * playlist.length);
            } else {
                // 列表循环或单曲循环模式，播放上一首
                prevIndex = currentSongIndex - 1;
                if (prevIndex < 0) {
                    prevIndex = playlist.length - 1;
                }
            }
            
            // 如果没有指定 autoPlay，则根据当前播放状态决定
            if (autoPlay === false) {
                const wasPlaying = !audioPlayer.paused;
                switchToSong(playlist[prevIndex], prevIndex, wasPlaying);
            } else {
                switchToSong(playlist[prevIndex], prevIndex, autoPlay);
            }
        }
        
        // 播放下一首
        function playNext(autoPlay = true) {
            if (playlist.length === 0) return;
            
            let nextIndex;
            if (playMode === 'shuffle') {
                // 随机播放模式下，随机选择下一首
                nextIndex = Math.floor(Math.random() * playlist.length);
            } else {
                // 列表循环或单曲循环模式，播放下一首
                nextIndex = currentSongIndex + 1;
                if (nextIndex >= playlist.length) {
                    nextIndex = 0;
                }
            }
            
            switchToSong(playlist[nextIndex], nextIndex, autoPlay);
        }
        
        // 切换播放模式
        function togglePlayMode() {
            const modes = ['list', 'shuffle', 'single'];
            const currentIndex = modes.indexOf(playMode);
            const nextIndex = (currentIndex + 1) % modes.length;
            playMode = modes[nextIndex];
            
            // 更新按钮图标和状态
            updatePlayModeButton();
            
            // 更新音频循环设置
            audioPlayer.loop = (playMode === 'single');
            
            // 显示提示
            const modeNames = {
                'list': '📋 列表循环',
                'shuffle': '🔀 随机播放',
                'single': '🔁 单曲循环'
            };
            showToast(modeNames[playMode]);
            
            console.log('播放模式切换为:', playMode);
        }
        
        // 更新播放模式按钮显示
        function updatePlayModeButton() {
            // 移除所有按钮的 active 类
            shuffleBtn.classList.remove('active');
            repeatBtn.classList.remove('active');
            
            // 根据当前模式设置按钮图标
            switch (playMode) {
                case 'list':
                    shuffleBtn.innerHTML = '<i class="fa fa-random text-lg"></i>';
                    repeatBtn.innerHTML = '<i class="fa fa-repeat text-lg"></i>';
                    break;
                case 'shuffle':
                    shuffleBtn.classList.add('active');
                    shuffleBtn.innerHTML = '<i class="fa fa-random text-lg"></i>';
                    repeatBtn.innerHTML = '<i class="fa fa-repeat text-lg"></i>';
                    break;
                case 'single':
                    shuffleBtn.innerHTML = '<i class="fa fa-random text-lg"></i>';
                    repeatBtn.classList.add('active');
                    repeatBtn.innerHTML = '<i class="fa fa-repeat text-lg"></i>';
                    break;
            }
            
            // 更新播放模式指示器
            const modeIndicator = document.getElementById('play-mode-indicator');
            if (modeIndicator) {
                const modeNames = {
                    'list': '列表循环',
                    'shuffle': '随机播放',
                    'single': '单曲循环'
                };
                modeIndicator.textContent = modeNames[playMode];
            }
        }
        
        // 更新音量图标
        function updateVolumeIcon() {
            if (audioPlayer.volume === 0 || audioPlayer.muted) {
                volumeBtn.innerHTML = '<i class="fa fa-volume-off text-lg"></i>';
            } else if (audioPlayer.volume < 0.5) {
                volumeBtn.innerHTML = '<i class="fa fa-volume-down text-lg"></i>';
            } else {
                volumeBtn.innerHTML = '<i class="fa fa-volume-up text-lg"></i>';
            }
        }
        
        // 切换静音
        function toggleMute() {
            audioPlayer.muted = !audioPlayer.muted;
            updateVolumeIcon();
            
            if (audioPlayer.muted) {
                volumeSlider.value = 0;
            } else {
                volumeSlider.value = audioPlayer.volume;
            }
        }
        
        // 跳转进度 - 支持点击和拖拽
        let isDragging = false;
        let dragStartX = 0;
        let hasMoved = false;
        
        function getProgressFromEvent(e) {
            const rect = progressContainer.getBoundingClientRect();
            let clientX;
            
            if (e.type.includes('touch')) {
                // 对于touch事件，优先使用changedTouches（适用于touchend）
                if (e.changedTouches && e.changedTouches.length > 0) {
                    clientX = e.changedTouches[0].clientX;
                } else if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                }
            } else {
                clientX = e.clientX;
            }
            
            let percent = (clientX - rect.left) / rect.width;
            return Math.max(0, Math.min(1, percent));
        }
        
        function updateProgressDisplay(percent) {
            progressBar.style.width = `${percent * 100}%`;
            if (isDragging) {
                progressBar.classList.add('dragging');
            } else {
                progressBar.classList.remove('dragging');
            }
            if (!isNaN(audioPlayer.duration)) {
                currentTimeEl.textContent = formatTime(percent * audioPlayer.duration);
            }
        }
        
        // 检查音频是否缓冲到指定位置
        function isBuffered(time) {
            if (audioPlayer.buffered.length === 0) return false;
            
            for (let i = 0; i < audioPlayer.buffered.length; i++) {
                if (time >= audioPlayer.buffered.start(i) && time <= audioPlayer.buffered.end(i)) {
                    return true;
                }
            }
            return false;
        }
        
        function seekToPercent(percent) {
            if (!isNaN(audioPlayer.duration) && audioPlayer.duration > 0) {
                const targetTime = percent * audioPlayer.duration;
                console.log('音频时长:', audioPlayer.duration.toFixed(2) + 's');
                console.log('跳转位置:', percent.toFixed(2) + '%');
                console.log('目标时间:', targetTime.toFixed(2) + 's');
                console.log('当前播放状态:', audioPlayer.paused ? '暂停' : '播放中');
                console.log('就绪状态:', audioPlayer.readyState);
                console.log('当前时间:', audioPlayer.currentTime.toFixed(2) + 's');
                
                // 检查缓冲状态
                const buffered = isBuffered(targetTime);
                console.log('目标位置是否已缓冲:', buffered);
                
                // 检查音频是否已加载
                if (audioPlayer.readyState >= 2) { // HAVE_CURRENT_DATA
                    audioPlayer.currentTime = targetTime;
                    console.log('设置后的当前时间:', audioPlayer.currentTime.toFixed(2) + 's');
                    
                    // 验证设置是否成功
                    setTimeout(() => {
                        console.log('验证当前时间:', audioPlayer.currentTime.toFixed(2) + 's');
                        if (Math.abs(audioPlayer.currentTime - targetTime) > 1) {
                            console.warn('警告：设置的时间与实际时间差异较大！');
                        }
                    }, 100);
                } else {
                    console.log('音频未完全加载，等待加载...');
                    // 等待音频加载后再跳转
                    audioPlayer.addEventListener('canplay', function onCanPlay() {
                        audioPlayer.currentTime = targetTime;
                        console.log('加载后设置当前时间:', audioPlayer.currentTime.toFixed(2) + 's');
                        audioPlayer.removeEventListener('canplay', onCanPlay);
                    }, { once: true });
                }
            } else {
                console.log('无法跳转：音频时长无效或为0');
            }
        }
        
        // 鼠标按下
        progressContainer.addEventListener('mousedown', function(e) {
            console.log('鼠标按下');
            isDragging = true;
            hasMoved = false;
            dragStartX = e.clientX;
            const percent = getProgressFromEvent(e);
            console.log('点击位置:', percent.toFixed(2));
            updateProgressDisplay(percent);
            seekToPercent(percent);
            e.preventDefault();
        });
        
        // 鼠标移动
        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                hasMoved = true;
                const percent = getProgressFromEvent(e);
                updateProgressDisplay(percent);
            }
        });
        
        // 鼠标释放
        document.addEventListener('mouseup', function(e) {
            if (isDragging) {
                console.log('鼠标释放，是否移动:', hasMoved);
                if (hasMoved) {
                    const percent = getProgressFromEvent(e);
                    seekToPercent(percent);
                }
                isDragging = false;
                hasMoved = false;
            }
        });
        
        // 触摸开始
        progressContainer.addEventListener('touchstart', function(e) {
            console.log('触摸开始');
            isDragging = true;
            hasMoved = false;
            dragStartX = e.touches[0].clientX;
            const percent = getProgressFromEvent(e);
            console.log('触摸位置:', percent.toFixed(2));
            updateProgressDisplay(percent);
            seekToPercent(percent);
            e.preventDefault();
        }, { passive: false });
        
        // 触摸移动
        document.addEventListener('touchmove', function(e) {
            if (isDragging) {
                hasMoved = true;
                const percent = getProgressFromEvent(e);
                updateProgressDisplay(percent);
                e.preventDefault();
            }
        }, { passive: false });
        
        // 触摸结束
        document.addEventListener('touchend', function(e) {
            if (isDragging) {
                console.log('触摸结束，是否移动:', hasMoved);
                if (hasMoved && e.changedTouches && e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    const mockEvent = {
                        type: 'touchend',
                        touches: [touch],
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    };
                    const percent = getProgressFromEvent(mockEvent);
                    seekToPercent(percent);
                }
                isDragging = false;
                hasMoved = false;
            }
        });
        
        // 点击事件（用于简单点击跳转）
        progressContainer.addEventListener('click', function(e) {
            console.log('点击事件触发，hasMoved:', hasMoved);
            // 只有在没有拖拽的情况下才处理点击
            if (!hasMoved) {
                const percent = getProgressFromEvent(e);
                seekToPercent(percent);
            }
        });
        
        // 更新播放列表高亮
        function updatePlaylistHighlight() {
            const items = document.querySelectorAll('.song-card');
            items.forEach((item, index) => {
                if (index === currentSongIndex) {
                    item.classList.add('current');
                } else {
                    item.classList.remove('current');
                }
            });
        }
        
        // 渲染收藏列表
        async function RenderLoveList() {
            const html_Love_part = document.getElementById("favorite-list");
            html_Love_part.innerHTML = '';
            
            try {
                const value = localStorage.getItem('Apollo_XZG_BoDian_Love');
                
                if (!value) {
                    html_Love_part.innerHTML = '<div class="text-center text-white/50 py-8">暂无收藏歌曲</div>';
                    return 0;
                }
                
                const To_Render = JSON.parse(value);
                
                if (!Array.isArray(To_Render) || To_Render.length <= 0) {
                    html_Love_part.innerHTML = '<div class="text-center text-white/50 py-8">暂无收藏歌曲</div>';
                    return 0;
                }
                
                playlist = [];
                
                for (let i = 0; i < To_Render.length; i++) {
                    if (!To_Render[i] || !Array.isArray(To_Render[i]) || To_Render[i].length < 4) {
                        console.warn('无效的收藏数据格式:', To_Render[i]);
                        continue;
                    }

                    try {
                        const TaudioUrl = await GetNowAudioUrl(To_Render[i][0]);

                        const songData = {
                            title: To_Render[i][1],
                            artist: To_Render[i][2],
                            album: To_Render[i][4] || "",
                            albumCover: To_Render[i][3],
                            audioUrl: TaudioUrl,
                            lyrics: ''
                        };
                        
                        playlist.push(songData);
                        
                        const LoveSongCard = document.createElement('li');
                        LoveSongCard.className = 'song-card flex items-center gap-3 p-3 rounded-lg mb-2 cursor-pointer';
                        LoveSongCard.dataset.index = playlist.length - 1;
                        
                        LoveSongCard.onclick = function() {
                            const index = parseInt(this.dataset.index);
                            switchToSong(playlist[index], index);
                        };
        
                        LoveSongCard.innerHTML = `
                            <img src="${songData.albumCover || 'https://dummyimage.com/600x400/000/fff&text=NoPicture'}" 
                                 alt="${songData.title}" 
                                 class="w-14 h-14 object-cover rounded-lg">
                            <div class="favorite-info flex-1 min-w-0">
                                <div class="favorite-title text-white font-medium truncate">${songData.title || '未知歌曲'}</div>
                                <div class="favorite-artist text-white/50 text-sm truncate">${songData.artist || '未知歌手'}</div>
                            </div>
                            <button class="control-btn p-2" onclick="event.stopPropagation(); playSongAtIndex(${playlist.length - 1});">
                                <i class="fa fa-play"></i>
                            </button>
                        `;
                        html_Love_part.appendChild(LoveSongCard);
                    } catch (error) {
                        console.error('加载歌曲失败:', error);
                    }
                }
                
                // 自动播放第一首
                if (playlist.length > 0 && currentSongIndex === -1) {
                    switchToSong(playlist[0], 0);
                }
                
            } catch (e) {
                console.error('解析收藏列表失败:', e);
                html_Love_part.innerHTML = '<div class="text-center text-white/50 py-8">加载收藏列表失败</div>';
                return 0;
            }
        }
        
        // 播放指定索引的歌曲
        function playSongAtIndex(index) {
            if (index >= 0 && index < playlist.length) {
                switchToSong(playlist[index], index);
            }
        }
        
        // 切换播放列表
        function togglePlaylist() {
            playlistPanel.classList.toggle('active');
        }
        
        // 事件监听
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', playPrev);
        nextBtn.addEventListener('click', playNext);
        
        volumeSlider.addEventListener('input', function() {
            audioPlayer.volume = this.value;
            audioPlayer.muted = false;
            updateVolumeIcon();
        });
        
        volumeBtn.addEventListener('click', toggleMute);
        
        shuffleBtn.addEventListener('click', togglePlayMode);
        repeatBtn.addEventListener('click', togglePlayMode);
        
        playlistBtn.addEventListener('click', togglePlaylist);
        closePlaylistBtn.addEventListener('click', togglePlaylist);
        
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('loadedmetadata', updateProgress);
        
        // 添加音频加载状态监控
        audioPlayer.addEventListener('loadstart', function() {
            console.log('音频开始加载');
        });
        
        audioPlayer.addEventListener('canplay', function() {
            console.log('音频可以播放，时长:', audioPlayer.duration);
        });
        
        audioPlayer.addEventListener('canplaythrough', function() {
            console.log('音频可以流畅播放');
        });
        
        audioPlayer.addEventListener('seeking', function() {
            console.log('正在跳转到:', audioPlayer.currentTime);
        });
        
        audioPlayer.addEventListener('seeked', function() {
            console.log('跳转完成，当前时间:', audioPlayer.currentTime);
        });
        
        audioPlayer.addEventListener('error', function(e) {
            console.error('音频错误:', e);
            console.error('错误代码:', audioPlayer.error);
            console.error('错误信息:', audioPlayer.error ? audioPlayer.error.message : '未知错误');
        });
        
        audioPlayer.addEventListener('stalled', function() {
            console.warn('音频加载停滞');
        });
        
        audioPlayer.addEventListener('suspend', function() {
            console.log('音频加载挂起');
        });
        
        audioPlayer.addEventListener('waiting', function() {
            console.log('等待更多数据...');
        });
        
        audioPlayer.addEventListener('ended', function() {
            console.log('歌曲播放结束，当前播放模式:', playMode);
            
            switch (playMode) {
                case 'list':
                    // 列表循环模式：播放下一首
                    console.log('列表循环模式，自动播放下一首');
                    playNext(true);
                    break;
                    
                case 'shuffle':
                    // 随机播放模式：随机播放下一首
                    console.log('随机播放模式，随机播放下一首');
                    playNext(true);
                    break;
                    
                case 'single':
                    // 单曲循环模式：重新播放当前歌曲
                    console.log('单曲循环模式，重新播放当前歌曲');
                    audioPlayer.currentTime = 0;
                    playAudio();
                    break;
            }
        });
        
        playlistPanel.addEventListener('click', function(e) {
            if (e.target === playlistPanel) {
                togglePlaylist();
            }
        });
        
        // 初始化
        window.addEventListener('DOMContentLoaded', function() {
            audioPlayer.volume = 0.75;
            updateVolumeIcon();
            updatePlayModeButton();
            RenderLoveList();
            
            // 键盘控制
            document.addEventListener('keydown', function(e) {
                // 如果用户正在输入框中输入，不触发键盘控制
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    return;
                }
                
                switch(e.code) {
                    case 'ArrowLeft':
                        // 左键后退5秒
                        if (!isNaN(audioPlayer.duration) && audioPlayer.duration > 0) {
                            const currentTime = audioPlayer.currentTime;
                            const newTime = Math.max(0, currentTime - 5);
                            console.log('后退5秒 - 原时间:', currentTime.toFixed(2) + 's, 新时间:', newTime.toFixed(2) + 's');
                            console.log('音频就绪状态:', audioPlayer.readyState);
                            
                            audioPlayer.currentTime = newTime;
                            
                            // 验证设置是否成功
                            setTimeout(() => {
                                console.log('设置后的实际时间:', audioPlayer.currentTime.toFixed(2) + 's');
                            }, 100);
                            
                            // 显示提示
                            showToast('⏪ 后退 5秒');
                        } else {
                            console.log('无法后退：音频未加载');
                        }
                        e.preventDefault();
                        break;
                        
                    case 'ArrowRight':
                        // 右键前进5秒
                        if (!isNaN(audioPlayer.duration) && audioPlayer.duration > 0) {
                            const currentTime = audioPlayer.currentTime;
                            const newTime = Math.min(audioPlayer.duration, currentTime + 5);
                            console.log('前进5秒 - 原时间:', currentTime.toFixed(2) + 's, 新时间:', newTime.toFixed(2) + 's');
                            console.log('音频就绪状态:', audioPlayer.readyState);
                            
                            audioPlayer.currentTime = newTime;
                            
                            // 验证设置是否成功
                            setTimeout(() => {
                                console.log('设置后的实际时间:', audioPlayer.currentTime.toFixed(2) + 's');
                            }, 100);
                            
                            // 显示提示
                            showToast('⏩ 前进 5秒');
                        } else {
                            console.log('无法前进：音频未加载');
                        }
                        e.preventDefault();
                        break;
                        
                    case 'Space':
                        // 空格键播放/暂停
                        e.preventDefault();
                        togglePlay();
                        break;
                        
                    case 'ArrowUp':
                        // 上键增加音量
                        e.preventDefault();
                        const newVolumeUp = Math.min(1, audioPlayer.volume + 0.05);
                        audioPlayer.volume = newVolumeUp;
                        volumeSlider.value = newVolumeUp;
                        updateVolumeIcon();
                        showToast('🔊 音量: ' + Math.round(newVolumeUp * 100) + '%');
                        break;
                        
                    case 'ArrowDown':
                        // 下键减少音量
                        e.preventDefault();
                        const newVolumeDown = Math.max(0, audioPlayer.volume - 0.05);
                        audioPlayer.volume = newVolumeDown;
                        volumeSlider.value = newVolumeDown;
                        updateVolumeIcon();
                        showToast('🔉 音量: ' + Math.round(newVolumeDown * 100) + '%');
                        break;
                        
                    case 'KeyM':
                        // M键切换播放模式
                        e.preventDefault();
                        togglePlayMode();
                        break;
                }
            });
        });
        
        // 显示提示信息
        function showToast(message) {
            // 移除已存在的提示
            const existingToast = document.querySelector('.toast-message');
            if (existingToast) {
                existingToast.remove();
            }
            
            // 创建提示元素
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.8);
                color: #FFD700;
                padding: 20px 40px;
                border-radius: 10px;
                font-size: 18px;
                font-weight: bold;
                z-index: 10000;
                animation: fadeInOut 1.5s ease-out;
            `;
            
            // 添加动画样式
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeInOut {
                    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                    20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(toast);
            
            // 1.5秒后移除提示
            setTimeout(() => {
                toast.remove();
                style.remove();
            }, 1500);
        }
    </script>
</body>
</html>
