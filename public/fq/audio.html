<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>听书 · 番茄书阁</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="reader-wrap">
    <header class="reader-toolbar">
      <div class="toolbar-inner">
        <div class="toolbar-left">
          <button class="back-btn" onclick="history.back()" aria-label="返回">←</button>
          <div class="toolbar-book-info">
            <div id="tb-book" class="book">加载中…</div>
            <div id="tb-chapter" class="chapter">—</div>
          </div>
        </div>
        <div class="toolbar-actions">
          <button onclick="gotoDir()" aria-label="目录" title="目录">☰</button>
          <button onclick="gotoReader()" aria-label="阅读" title="阅读">📖</button>
          <button onclick="gotoComment()" aria-label="评论" title="评论">💬</button>
        </div>
      </div>
    </header>

    <section id="player-area" style="padding: 24px 16px; max-width: 820px; margin: 0 auto;">
      <div class="loading"><div class="loading-spinner"></div><span>正在加载音频…</span></div>
    </section>

    <section id="chapter-area" style="max-width: 820px; margin: 0 auto; padding: 0 16px 48px;">
      <div class="loading"><div class="loading-spinner"></div><span>正在加载章节列表…</span></div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
  (function () {
    'use strict';

    var bookId = Fq.getQuery('book_id');
    var itemId = Fq.getQuery('item_id');
    var title = Fq.getQuery('title');
    var bookDetail = null;
    var chapterList = [];
    var currentAudioUrl = '';
    var currentIndex = -1;
    var audioEl = null;

    if (title) {
      document.getElementById('tb-book').textContent = title;
    }

    function gotoDir() {
      if (!bookId) return;
      location.href = 'directory.html?book_id=' + encodeURIComponent(bookId) + (title ? '&title=' + encodeURIComponent(title) : '');
    }
    function gotoReader() {
      if (!bookId || !itemId) return;
      var q = 'book_id=' + encodeURIComponent(bookId) + '&item_id=' + encodeURIComponent(itemId);
      if (title) q += '&title=' + encodeURIComponent(title);
      location.href = 'reader.html?' + q;
    }
    function gotoComment() {
      if (!bookId) return;
      location.href = 'comment.html?book_id=' + encodeURIComponent(bookId) + (title ? '&title=' + encodeURIComponent(title) : '');
    }
    window.gotoDir = gotoDir;
    window.gotoReader = gotoReader;
    window.gotoComment = gotoComment;

    function findMediaUrl(data) {
      if (!data) return '';
      if (typeof data === 'string') {
        if (/^https?:\/\//.test(data) && /\.(mp3|m4a|wav|aac)/i.test(data)) return data;
        return '';
      }
      var candidates = [
        data.audio_url, data.url, data.mp3, data.audio,
        data.audioUrl, data.media_url, data.file_url,
        data.audio_mp3, data.source_url
      ];
      for (var i = 0; i < candidates.length; i++) {
        if (typeof candidates[i] === 'string' && candidates[i] && /^https?:\/\//.test(candidates[i])) {
          return candidates[i];
        }
      }
      if (typeof data === 'object') {
        for (var k in data) {
          var v = data[k];
          if (typeof v === 'string' && /^https?:\/\//.test(v) && /\.(mp3|m4a|wav|aac)/i.test(v)) {
            return v;
          }
        }
      }
      return '';
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '00:00';
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function renderPlayer(chapterTitle, audioUrl, coverUrl) {
      var area = document.getElementById('player-area');
      var safeCover = coverUrl || '';
      var safeTitle = chapterTitle || '未知章节';
      var safeBook = (bookDetail && (bookDetail.book_name || bookDetail.name)) || title || '未知书籍';
      var coverHtml = safeCover
        ? '<img src="' + Fq.escapeHtml(safeCover) + '" alt="" onerror="this.style.display=\'none\';">'
        : '';

      area.innerHTML =
        '<div class="audio-player fade-in" id="audio-player">' +
          '<div class="audio-cover" id="audio-cover">' + coverHtml + '</div>' +
          '<div class="audio-title">' + Fq.escapeHtml(safeTitle) + '</div>' +
          '<div class="audio-book">' + Fq.escapeHtml(safeBook) + '</div>' +
          '<div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>' +
          '<div class="time-row">' +
            '<span id="current-time">00:00</span>' +
            '<span id="duration">00:00</span>' +
          '</div>' +
          '<div class="play-controls">' +
            '<button id="prev-btn" aria-label="上一章" title="上一章">⏮</button>' +
            '<button id="play-btn" class="play-btn" aria-label="播放/暂停" title="播放/暂停">▶</button>' +
            '<button id="next-btn" aria-label="下一章" title="下一章">⏭</button>' +
          '</div>' +
          '<audio id="native-audio" class="native-audio" preload="metadata" playsinline></audio>' +
        '</div>';

      audioEl = document.getElementById('native-audio');
      audioEl.src = audioUrl;

      var playBtn = document.getElementById('play-btn');
      var prevBtn = document.getElementById('prev-btn');
      var nextBtn = document.getElementById('next-btn');
      var progressBar = document.getElementById('progress-bar');
      var progressFill = document.getElementById('progress-fill');
      var currentTimeEl = document.getElementById('current-time');
      var durationEl = document.getElementById('duration');
      var cover = document.getElementById('audio-cover');

      playBtn.onclick = function () {
        if (audioEl.paused) {
          audioEl.play().catch(function () {});
        } else {
          audioEl.pause();
        }
      };
      prevBtn.onclick = function () { switchChapter(-1); };
      nextBtn.onclick = function () { switchChapter(1); };

      progressBar.onclick = function (e) {
        if (!audioEl.duration || isNaN(audioEl.duration)) return;
        var rect = progressBar.getBoundingClientRect();
        var ratio = (e.clientX - rect.left) / rect.width;
        audioEl.currentTime = audioEl.duration * Math.max(0, Math.min(1, ratio));
      };

      audioEl.addEventListener('play', function () {
        playBtn.textContent = '⏸';
        cover.classList.add('playing');
      });
      audioEl.addEventListener('pause', function () {
        playBtn.textContent = '▶';
        cover.classList.remove('playing');
      });
      audioEl.addEventListener('loadedmetadata', function () {
        durationEl.textContent = formatTime(audioEl.duration);
      });
      audioEl.addEventListener('timeupdate', function () {
        var pct = audioEl.duration ? (audioEl.currentTime / audioEl.duration) * 100 : 0;
        progressFill.style.width = pct + '%';
        currentTimeEl.textContent = formatTime(audioEl.currentTime);
      });
      audioEl.addEventListener('ended', function () {
        switchChapter(1);
      });
      audioEl.addEventListener('error', function () {
        var player = document.getElementById('audio-player');
        if (player) {
          var msg = document.createElement('div');
          msg.className = 'error-box';
          msg.style.marginTop = '16px';
          msg.textContent = '⚠ 音频加载失败，可能是链接不可用或格式不支持';
          player.appendChild(msg);
        }
      });
    }

    function renderChapterList() {
      var area = document.getElementById('chapter-area');
      if (!chapterList.length) {
        Fq.showEmpty(area, '暂无章节');
        return;
      }
      var html = '<div class="section-title"><h2>章节列表</h2></div>' +
        '<div class="chapter-list fade-in">';
      for (var i = 0; i < chapterList.length; i++) {
        var ch = chapterList[i];
        var active = (ch.item_id === itemId) || (i === currentIndex);
        var t = ch.title || ch.chapter_title || ch.chapter_name || ('第' + (i + 1) + '章');
        html += '<div class="chapter-item' + (active ? ' active' : '') + '" data-index="' + i + '" data-item="' + Fq.escapeHtml(ch.item_id || '') + '">' +
          '<span class="title-cell">' + Fq.escapeHtml(t) + '</span>' +
          (active ? '<span class="chapter-meta" style="color:var(--tomato);">播放中</span>' : '') +
        '</div>';
      }
      html += '</div>';
      area.innerHTML = html;

      var items = area.querySelectorAll('.chapter-item');
      items.forEach(function (el) {
        el.onclick = function () {
          var idx = parseInt(el.getAttribute('data-index'), 10);
          var iid = el.getAttribute('data-item');
          if (iid) {
            itemId = iid;
            currentIndex = idx;
            loadAndPlay();
          }
        };
      });
    }

    function switchChapter(delta) {
      if (!chapterList.length) return;
      var idx = currentIndex;
      if (idx < 0) {
        for (var i = 0; i < chapterList.length; i++) {
          if (chapterList[i].item_id === itemId) { idx = i; break; }
        }
      }
      idx = idx + delta;
      if (idx < 0 || idx >= chapterList.length) return;
      itemId = chapterList[idx].item_id;
      currentIndex = idx;
      loadAndPlay();
    }

    function loadAndPlay() {
      var playerArea = document.getElementById('player-area');
      Fq.showLoading(playerArea, '正在加载音频…');

      document.getElementById('tb-chapter').textContent = '加载中…';

      Promise.all([
        FqApi.getChapterAudio(itemId),
        FqApi.getChapterContent(itemId)
      ]).then(function (results) {
        var audioResp = results[0];
        var contentResp = results[1];

        var chapterTitle = '';
        if (audioResp && audioResp.data) {
          chapterTitle = audioResp.data.chapter_title || audioResp.data.title || audioResp.data.chapter_name || '';
        }
        if (!chapterTitle && contentResp && contentResp.data) {
          chapterTitle = contentResp.data.chapter_title || contentResp.data.title || '';
        }

        var audioUrl = findMediaUrl(audioResp && audioResp.data);
        if (!audioUrl) {
          audioUrl = findMediaUrl(contentResp && contentResp.data);
        }

        document.getElementById('tb-chapter').textContent = chapterTitle || '未知章节';

        if (!audioUrl) {
          document.getElementById('player-area').innerHTML =
            '<div class="error-box">⚠ 未能获取到该章节的音频链接，您可以尝试切换到其它章节或稍后再试。</div>';
          return;
        }

        var coverUrl = (bookDetail && (bookDetail.thumb_url || bookDetail.cover_url || bookDetail.audio_thumb_uri || bookDetail.book_cover_url)) || '';
        renderPlayer(chapterTitle, audioUrl, coverUrl);
      }).catch(function (err) {
        document.getElementById('player-area').innerHTML =
          '<div class="error-box">⚠ 加载失败：' + Fq.escapeHtml((err && err.message) || String(err)) + '</div>';
      });
    }

    function loadBook() {
      if (!bookId) return;
      FqApi.getDetail(bookId).then(function (resp) {
        if (resp && resp.data) {
          bookDetail = resp.data;
          var bName = bookDetail.book_name || bookDetail.name || title || '';
          if (bName) {
            document.getElementById('tb-book').textContent = bName;
            title = bName;
          }
        }
      }).catch(function () {});

      FqApi.getBook(bookId).then(function (resp) {
        chapterList = FqApi.extractChapterList(resp);
        if (currentIndex < 0 && chapterList.length) {
          for (var i = 0; i < chapterList.length; i++) {
            if (chapterList[i].item_id === itemId) { currentIndex = i; break; }
          }
          if (currentIndex < 0) currentIndex = 0;
        }
        renderChapterList();
      }).catch(function () {
        document.getElementById('chapter-area').innerHTML =
          '<div class="error-box">⚠ 章节列表加载失败</div>';
      });
    }

    if (!bookId || !itemId) {
      document.getElementById('player-area').innerHTML =
        '<div class="error-box">⚠ 参数错误：缺少 book_id 或 item_id</div>';
      document.getElementById('chapter-area').innerHTML = '';
      return;
    }

    loadBook();
    loadAndPlay();
  })();
  </script>
</body>
</html>
